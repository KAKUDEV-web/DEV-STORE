<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#060607">
  <meta name="description" content="DEV STORE — a minimal glass store for games and apps.">
  <title>DEV STORE — Games &amp; Apps</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Cg fill='%23fafafa'%3E%3Crect x='14' y='14' width='16' height='16' rx='4'/%3E%3Crect x='34' y='14' width='16' height='16' rx='4' opacity='.5'/%3E%3Crect x='14' y='34' width='16' height='16' rx='4' opacity='.5'/%3E%3Crect x='34' y='34' width='16' height='16' rx='4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== SVG icon sprite (no emojis, real icon assets) ===== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24" fill="currentColor">
      <rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".45"/>
      <rect x="3" y="13" width="8" height="8" rx="2" opacity=".45"/><rect x="13" y="13" width="8" height="8" rx="2"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.5-4.5"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
    </symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12 5 5L20 7"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5h.01"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85 1 6.57 2.57L21 8"/><path d="M21 3v5h-5"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-4.5-4.5L9 18"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8 12 3 3 8v8l9 5 9-5V8"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>
    </symbol>
    <symbol id="i-gamepad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 11h4"/><path d="M8 9v4"/><path d="M15 12h.01"/><path d="M18 10h.01"/>
      <path d="M17.32 5H6.68a4 4 0 0 0-3.98 3.59C2.6 9.42 2 14.46 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.41-1.41A2 2 0 0 1 9.83 16h4.34a2 2 0 0 1 1.42.59L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.54-.6-6.58-.68-7.41A4 4 0 0 0 17.32 5Z"/>
    </symbol>
  </svg>

  <!-- ===== Ambient monochrome background ===== -->
  <div class="bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="noise"></div>
  </div>

  <!-- ===== Top bar : brand + search + refresh ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="DEV STORE home">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-logo"></use></svg></span>
        <span class="brand-name">DEV&nbsp;<span class="dim">STORE</span></span>
      </a>
      <div class="search" role="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="searchInput" type="search" placeholder="Search games &amp; apps" autocomplete="off" spellcheck="false" aria-label="Search games and apps">
        <kbd class="slash" aria-hidden="true">/</kbd>
        <button id="searchClear" class="icon-btn ghost" type="button" aria-label="Clear search" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <button id="refreshBtn" class="icon-btn glass-circle" type="button" aria-label="Refresh store data" title="Refresh store data">
        <svg class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg>
      </button>
    </div>
  </header>

  <noscript><div class="noscript">DEV STORE needs JavaScript enabled to load its catalog.</div></noscript>

  <!-- ===== App view (home / category / search / details) ===== -->
  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <span class="foot-brand">DEV STORE</span>
    <span class="dot" aria-hidden="true">·</span>
    <span id="footCount">Loading…</span>
  </footer>

  <!-- ===== Screenshot lightbox ===== -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-backdrop" data-lb-close></div>
    <button id="lbClose" class="lb-close icon-btn glass-circle" type="button" data-lb-close aria-label="Close viewer">
      <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
    <button id="lbPrev" class="lb-nav lb-prev icon-btn glass-circle" type="button" data-lb-prev aria-label="Previous screenshot">
      <svg class="ic flip" aria-hidden="true"><use href="#i-chev-right"></use></svg>
    </button>
    <figure class="lb-stage">
      <img id="lbImg" alt="Screenshot preview">
      <figcaption id="lbCount" class="lb-count"></figcaption>
    </figure>
    <button id="lbNext" class="lb-nav lb-next icon-btn glass-circle" type="button" data-lb-next aria-label="Next screenshot">
      <svg class="ic" aria-hidden="true"><use href="#i-chev-right"></use></svg>
    </button>
  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>
